<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — CampusKouture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Montserrat", sans-serif;
      background: #f5f5f3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: white;
      padding: 40px 35px;
      border-radius: 4px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      text-align: center;
    }
    .login-card h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 8px;
      color: #111;
    }
    .login-card p {
      font-size: 12px;
      color: #888;
      margin-bottom: 25px;
    }
    .login-card input {
      width: 100%;
      padding: 13px 14px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 2px;
      font: inherit;
      font-size: 13px;
    }
    .login-card button {
      width: 100%;
      padding: 13px;
      background: #111;
      color: white;
      border: none;
      font: inherit;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .login-card button:hover { background: #333; }
    .flash {
      font-size: 11px;
      margin-bottom: 15px;
      color: red;
    }
    .flash.success { color: green; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>CAMPUSKOUTURE</h1>
    <p>Admin Login</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
      <input type="password" name="password" placeholder="Enter admin password" required />
      <button type="submit">Login</button>
    </form>
  </div>
</body>
</html>
