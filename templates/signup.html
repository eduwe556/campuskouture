<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — CampusKouture</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Montserrat", sans-serif; background: #f5f5f3; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: white; padding: 40px 35px; border-radius: 4px; width: 100%;
      max-width: 420px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    .card h1 { font-size: 24px; font-weight: 800; letter-spacing: -1px; margin-bottom: 6px; text-align: center; }
    .card p.sub { font-size: 12px; color: #888; text-align: center; margin-bottom: 25px; }
    .card label { font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.5px; color: #555; display: block; margin-bottom: 5px; }
    .card input[type="text"], .card input[type="email"], .card input[type="password"] {
      width: 100%; padding: 12px 14px; margin-bottom: 15px;
      border: 1px solid #ddd; border-radius: 2px; font: inherit; font-size: 13px; }
    .role-choice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .role-choice label {
      border: 2px solid #ddd; border-radius: 4px; padding: 14px 10px; text-align: center;
      cursor: pointer; font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; color: #888; transition: all 0.2s; display: block; margin: 0;
    }
    .role-choice label .emoji { display: block; font-size: 22px; margin-bottom: 6px; }
    .role-choice input { display: none; }
    .role-choice input:checked + label { border-color: #111; background: #111; color: white; }
    .card button { width: 100%; padding: 13px; background: #111; color: white; border: none;
      font: inherit; font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1px; cursor: pointer; }
    .card button:hover { background: #333; }
    .card .alt { font-size: 12px; text-align: center; margin-top: 20px; color: #666; }
    .card .alt a { color: #111; font-weight: 700; text-decoration: none; }
    .flash { font-size: 12px; margin-bottom: 15px; padding: 10px; background: #f0f0f0; border-left: 3px solid #111; }
    .flash.success { border-left-color: green; color: green; }
    .flash.error { border-left-color: red; color: #c00; }
  </style>
</head>
<body>
  <div class="card">
    <h1>CAMPUSKOUTURE</h1>
    <p class="sub">Create your account</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
      <label>I want to</label>
      <div class="role-choice">
        <input type="radio" id="r-buyer" name="role" value="buyer" checked />
        <label for="r-buyer"><span class="emoji">🛍️</span>Buy Clothes</label>
        <input type="radio" id="r-vendor" name="role" value="vendor" />
        <label for="r-vendor"><span class="emoji">🏪</span>Sell Clothes</label>
      </div>

      <label>Full Name</label>
      <input type="text" name="name" required />
      <label>Email</label>
      <input type="email" name="email" required />
      <label>Password</label>
      <input type="password" name="password" required minlength="6" />
      <label>Confirm Password</label>
      <input type="password" name="confirm_password" required minlength="6" />
      <button type="submit">Create Account</button>
    </form>

    <div class="alt">Already have an account? <a href="{{ url_for('login') }}">Log in</a></div>
    <div class="alt"><a href="{{ url_for('home') }}">← Back to shop</a></div>
  </div>
</body>
</html>
